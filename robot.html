<script>

const $=id=>document.getElementById(id);
const SZ=[1043.0,1030.5];
const P={eyeL:[447.5,237.5,54.5,101.5],eyeR:[650.5,244.5,56.5,101.5],mouth:[523.0,321.5,97.0,53.0]};
const stage=$('stage');
const eyes=[$('eyeL'),$('eyeR')];
for(const [id,[x,y,w,h]] of Object.entries(P)){
  const el=$(id);
  el.style.left=x/SZ[0]*100+'%';
  el.style.top=y/SZ[1]*100+'%';
  el.style.width=w/SZ[0]*100+'%';
  el.style.height=h/SZ[1]*100+'%';
  el.style.transformOrigin='50% 50%';
}
let blinkStart=-1e9, secondBlink=-1e9;
let nextBlink=performance.now()+1800+Math.random()*1800;
function blinkAmount(now,start){
  const progress=(now-start)/190;
  return progress>=0&&progress<=1 ? Math.sin(Math.PI*progress) : 0;
}
function frame(now){
  if(now>=nextBlink){
    blinkStart=now;
    secondBlink=Math.random()<0.2 ? now+260 : -1e9;
    nextBlink=now+2400+Math.random()*3600;
  }
  const blink=Math.max(blinkAmount(now,blinkStart),blinkAmount(now,secondBlink));
  for(const eye of eyes){
    eye.style.transform=`scaleY(${Math.max(0.06,1-blink)})`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
